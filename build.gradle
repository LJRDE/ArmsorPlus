plugins {
    id 'java'
}

group = 'Dim_LJR'
version = '0.3-J+'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
}

tasks.register('runPurpur', JavaExec) {
    dependsOn jar

    def serverJar = file("test/paper-1.21.11-132.jar")
    def runDir = file("run")

    classpath = files(serverJar)
    workingDir = runDir
    standardInput = System.in
    args("--nogui")

    // 每次启动前: 把旧版 jar 备份到 versions 目录, 再替换为新版
    doFirst {
        runDir.mkdirs()
        def pluginsDir = file("run/plugins")
        def versionsDir = file("build/plugin-versions")
        pluginsDir.mkdirs()
        versionsDir.mkdirs()

        def newJar = tasks.jar.archiveFile.get().asFile
        def stamp = new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date())
        fileTree(pluginsDir).matching { include "ArmsorPlus*.jar" }.each { oldJar ->
            // 备份旧版到 versions (带时间戳, 同名版本次也会保留)
            copy {
                from oldJar
                into versionsDir
                rename { String fileName -> fileName.replace(".jar", "-${stamp}.jar") }
            }
            // 从 run/plugins 删除旧 jar (避免 Paper 加载旧版重复插件)
            if (oldJar.name != newJar.name) {
                delete oldJar
            }
        }
        copy {
            from tasks.jar.archiveFile
            into pluginsDir
        }
        println "已更新 run/plugins，旧版已备份到 build/plugin-versions/"
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register('reload') {
    dependsOn jar
    doLast {
        def pluginsDir = file("run/plugins")
        def versionsDir = file("build/plugin-versions")
        pluginsDir.mkdirs()
        versionsDir.mkdirs()

        // 把旧版 jar 备份到 versions 目录, 再替换为新版
        def newJar = tasks.jar.archiveFile.get().asFile
        def stamp = new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date())
        fileTree(pluginsDir).matching { include "ArmsorPlus*.jar" }.each { oldJar ->
            copy {
                from oldJar
                into versionsDir
                rename { String fileName -> fileName.replace(".jar", "-${stamp}.jar") }
            }
            if (oldJar.name != newJar.name) {
                delete oldJar
            }
        }
        copy {
            from tasks.jar.archiveFile
            into pluginsDir
        }
        println "已更新 run/plugins，旧版已备份到 build/plugin-versions/，在服务端输入指令重载插件"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
