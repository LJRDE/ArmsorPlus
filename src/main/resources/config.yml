OpenSeaName: OpenSea
MapZipName: OpenSea.zip
SpawnOpenSea: true
AutoResetOpenSeaMap: true
# 是否启用插件植物系统 (水果/树苗) — 关闭后在向导书中不显示相关物品
EnablePlants: false已修复的
# 资源包下载地址 (需为可直连的 .zip 文件 URL) — 设置后玩家可在设置菜单点击下载
ResourcePackUrl: "https://github.com/LJRDE/ArmsorPlus/releases/download/0.3-J+/ArmsorPlusResourcesPack.zip"
# ---- 影武者BOSS皮肤 (SkinRestorer式, 默认不占端口) ----
# 默认方案: 从Mojang在线拉取指定正版账号的已签名皮肤, 其URL在 textures.minecraft.net 上,
# 原版客户端即可直接显示, 无需本地HTTP端口, 也无需客户端装皮肤mod。
# BossSkinPlayerName: 想要用作影武者皮肤的正版Minecraft账号名 (账号必须真实存在且已设置皮肤)
BossSkinPlayerName: "Village_master"
# 兜底: 本地皮肤文件 (plugins/ArmsorPlus/skins/ 下的PNG)。
# 以 data:image/png;base64 形式内嵌到textures属性 — 原版客户端不会加载 data-url,
# 仅支持 data-url 的 modded 客户端可见; 所以它只是兜底, 保证离线/无网时Boss不至于没皮肤。
BossSkinFile: "Village_master.png"
# 已烘焙皮肤 (value+signature, 来自正版账号切换皮肤时抓取并永久保存)。
# 这两个键存在时优先使用, 不依赖Mojang在线、不占端口, 原版+离线服均可用。
# ---- 影武者 (ShadowWarrior) 使用旧皮肤 ----
BossSkinValue: ""
BossSkinSignature: ""
# ---- 村民队长 (VillageCaptain) 使用新皮肤 ----
CaptainSkinValue: ""
CaptainSkinSignature: ""
# ---- 本地HTTP皮肤文件服务器 (仅 modded 客户端需要, 默认关闭 = 不占用端口) ----
# 只有当你给所有客户端都装了 CustomSkinLoader 等支持任意域名皮肤的mod时才需要开启。
# 开启后绑定 SkinServerPort 端口; 关掉则完全不占端口。
EnableSkinServer: false
# SkinServerHost: 客户端下载皮肤用的主机IP。留空时自动判断:
#   - 客户端与服务端同机(回环连接) → 自动用 127.0.0.1
#   - 远程客户端 → 自动检测本机IP (若拿到的是内网/虚拟网卡IP而连不上, 请手动填写)
# 服务器有公网IP时: 填公网IP, 并确保该IP上开放 SkinServerPort 端口(防火墙放行/路由器转发)
SkinServerHost: ""
SkinServerPort: 26666